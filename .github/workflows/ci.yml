name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          SECURELINE_GITHUB_REPO_URL=https://github.com/odevm/secure-line-app
          SECURELINE_GITHUB_OWNER=odevm
          SECURELINE_GITHUB_REPO=secure-line-app
          SECURELINE_TELEGRAM_CHANNEL_URL=https://t.me/secureline_app
          SECURELINE_FIREBASE_ENABLED=false
          EOF
          # Strip leading spaces from heredoc indentation
          sed -i 's/^[[:space:]]*//' local.properties

      - name: Inject google-services.json when secret present
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            sed -i 's/SECURELINE_FIREBASE_ENABLED=false/SECURELINE_FIREBASE_ENABLED=true/' local.properties
          fi

      - name: ktlint
        run: ./gradlew :app:ktlintCheck --no-daemon

      - name: detekt
        run: ./gradlew :app:detekt --no-daemon

      - name: Host modem + codec2 smoke
        run: bash native/tests/run_host_modem_tests.sh

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

  signed-release:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Skip if signing secrets missing
        id: check
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wire signing + optional Firebase
        if: steps.check.outputs.skip == 'false'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p secrets
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > secrets/secureline-release.p12
          cat > keystore.properties << EOF
          storeFile=secrets/secureline-release.p12
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
          sed -i 's/^[[:space:]]*//' keystore.properties || true
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          SECURELINE_GITHUB_REPO_URL=https://github.com/odevm/secure-line-app
          SECURELINE_GITHUB_OWNER=odevm
          SECURELINE_GITHUB_REPO=secure-line-app
          SECURELINE_TELEGRAM_CHANNEL_URL=https://t.me/secureline_app
          SECURELINE_FIREBASE_ENABLED=false
          EOF
          sed -i 's/^[[:space:]]*//' local.properties
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            sed -i 's/SECURELINE_FIREBASE_ENABLED=false/SECURELINE_FIREBASE_ENABLED=true/' local.properties
          fi
      - name: Assemble signed release
        if: steps.check.outputs.skip == 'false'
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip == 'false'
        with:
          name: secureline-release-apk
          path: app/build/outputs/apk/release/*.apk
