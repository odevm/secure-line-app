build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 8
    excludedFunctions:
      - 'equals'
      - 'parse'
  ThrowsCount:
    max: 8

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
