build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 8
    excludedFunctions:
      - 'equals'
      - 'parse'

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
